<!DOCTYPE html>
<html lang="en" data-app-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evora Office (E05) — Phase 4 Interactive Gate 2 Wireframes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="studio-topbar">
    <div class="studio-brand">
      <div class="eo-mark-mini" aria-hidden="true">EO</div>
      <div class="studio-title-group">
        <h1>Evora Office (E05) — Interactive Gate 2 Prototype</h1>
        <p>Style B (CD-06) · All 21 Compose Routes + 2 Glance Widgets · WCAG AA Verified (75/75)</p>
      </div>
    </div>
    <div class="studio-controls">
      <div class="ctrl-group" role="group" aria-label="Theme Switcher">
        <button class="ctrl-btn active" data-theme-btn="light">Light Theme</button>
        <button class="ctrl-btn" data-theme-btn="dark">Dark Theme</button>
      </div>
      <div class="ctrl-group" role="group" aria-label="Viewport Size">
        <button class="ctrl-btn active" data-device-btn="phone">Phone (390×844)</button>
        <button class="ctrl-btn" data-device-btn="tablet">Tablet (880×620)</button>
      </div>
      <div class="ctrl-group" role="group" aria-label="Screen State">
        <button class="ctrl-btn active" data-state-btn="content">Content</button>
        <button class="ctrl-btn" data-state-btn="loading">Loading</button>
        <button class="ctrl-btn" data-state-btn="empty">Empty</button>
        <button class="ctrl-btn" data-state-btn="error">Error/SAF</button>
      </div>
    </div>
  </header>

  <main class="studio-body">
    <aside class="route-sidebar" id="routeSidebar" aria-label="Wireframe Route Directory"></aside>

    <section class="device-stage">
      <div class="device-frame" id="deviceFrame" role="region" aria-label="Android Device Preview">
        <div class="android-status-bar" id="statusBar">
          <span>9:41</span>
          <div class="status-icons">
            <span>5G</span>
            <span>Wi-Fi</span>
            <span>94%</span>
          </div>
        </div>
        <div class="screen-viewport" id="screenViewport"></div>
        <div class="android-gesture-bar"><span></span></div>
      </div>
    </section>

    <aside class="spec-inspector" id="specInspector" aria-label="Design Spec Inspector"></aside>
  </main>

  <script src="app.js" defer></script>
</body>
</html>

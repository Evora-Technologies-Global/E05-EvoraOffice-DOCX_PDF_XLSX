name: R-01 LibreOfficeKit Android ARM64 16 KB Build

on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: 'LibreOffice / Collabora Core Git URL (MPLv2/LGPLv3)'
        required: true
        default: 'https://github.com/LibreOffice/core.git'
        type: string
      core_ref:
        description: 'Branch or tag to cross-compile'
        required: true
        default: 'libreoffice-25-8'
        type: string
      distro:
        description: 'LibreOffice distro config (LibreOfficeAndroidAarch64 or CPAndroid)'
        required: true
        default: 'LibreOfficeAndroidAarch64'
        type: string
      ndk_version:
        description: 'Android NDK version (>= r27 for 16 KB alignment)'
        required: true
        default: '28.2.13676358'
        type: string

jobs:
  build-lok-arm64-16kb:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install LibreOffice Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ant autoconf automake bison bzip2 ccache cpio doxygen flex g++ gettext git gperf \
            intltool libarchive-zip-perl libcairo2-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libice-dev libsm-dev libx11-dev libxext-dev libxrender-dev \
            libxml2-utils libxslt1-dev libxt-dev make meson nasm ninja-build patch pkg-config \
            python3 python3-dev python3-lxml python3-setuptools unzip xsltproc zip zlib1g-dev \
            openjdk-17-jdk llvm
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Android SDK & NDK ${{ inputs.ndk_version }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;${{ inputs.ndk_version }}'

      - name: Maximize build disk space for LibreOffice C++ build
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-android: 'false'

      - name: Checkout E05 scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/verify_16kb_elf.py

      - name: Verify Android NDK installation
        env:
          ANDROID_NDK_PATH: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ inputs.ndk_version }}
        run: |
          df -h
          test -f "${{ github.workspace }}/scripts/verify_16kb_elf.py"
          ls -la "${{ env.ANDROID_SDK_ROOT }}/ndk"
          test -f "${ANDROID_NDK_PATH}/source.properties" || test -f "${ANDROID_NDK_PATH}/RELEASE.TXT"
          cat "${ANDROID_NDK_PATH}/source.properties"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: lok-ccache-${{ inputs.distro }}-${{ inputs.ndk_version }}-${{ github.sha }}
          restore-keys: |
            lok-ccache-${{ inputs.distro }}-${{ inputs.ndk_version }}-
            lok-ccache-${{ inputs.distro }}-

      - name: Shallow clone LibreOffice Core (${{ inputs.core_ref }})
        run: |
          git clone --depth 1 --branch "${{ inputs.core_ref }}" "${{ inputs.core_repo }}" lo-core
          git -C lo-core rev-parse HEAD > lo-core-commit.txt

      - name: Configure LibreOfficeKit ARM64 with 16 KB linker flags
        working-directory: lo-core
        env:
          ANDROID_NDK_PATH: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ inputs.ndk_version }}
          JAVA_HOME_PATH: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          mkdir -p "${{ github.workspace }}/.tmp"
          export TMPDIR="${{ github.workspace }}/.tmp"
          # Ensure final liblo-native-code.so explicitly receives 16 KB ELF page alignment flags
          # and drop obsolete -D_PR_NO_LARGE_FILES=1 (tdf#162769) if an older branch is selected
          python3 -I -c '
          from pathlib import Path
          p = Path("android/Bootstrap/Makefile.shared")
          txt = p.read_text()
          flag = "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          if flag not in txt:
              txt = txt.replace("$(CXX) -Wl,--build-id=sha1", f"$(CXX) {flag} -Wl,--build-id=sha1")
              p.write_text(txt)
          nss_mk = Path("external/nss/ExternalProject_nss.mk")
          if nss_mk.exists():
              nss_txt = nss_mk.read_text()
              if " -D_PR_NO_LARGE_FILES=1" in nss_txt:
                  nss_mk.write_text(nss_txt.replace(" -D_PR_NO_LARGE_FILES=1", ""))
          '
          cat > autogen.input <<EOF
          --build=x86_64-unknown-linux-gnu
          --with-jdk-home=${JAVA_HOME_PATH}
          --with-android-sdk=${{ env.ANDROID_SDK_ROOT }}
          --with-android-ndk=${ANDROID_NDK_PATH}
          --with-android-api-level=26
          --with-distro=${{ inputs.distro }}
          --enable-android-lok
          --enable-android-editing
          --enable-ccache
          --disable-odk
          --without-junit
          --without-help
          --without-myspell-dicts
          EOF
          export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          ./autogen.sh

      - name: Cross-compile LibreOfficeKit Android ARM64
        working-directory: lo-core
        env:
          LDFLAGS: "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        run: |
          mkdir -p "${{ github.workspace }}/.ccache" "${{ github.workspace }}/.tmp"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export TMPDIR="${{ github.workspace }}/.tmp"
          ccache -M 4G || true
          make -j"$(nproc)" || make -j2

      - name: Collect .so binaries, runtime assets and verify 16 KB alignment
        run: |
          mkdir -p out/jniLibs/arm64-v8a out/mplv2-disclosure
          mkdir -p out/assets/unpack/program out/assets/unpack/etc/fonts out/assets/unpack/user/fonts
          mkdir -p out/assets/program/resource out/assets/program/services out/assets/share/registry/res out/assets/share/config
          if [ -d lo-core/android/jniLibs/arm64-v8a ]; then
            cp -v lo-core/android/jniLibs/arm64-v8a/*.so out/jniLibs/arm64-v8a/
          fi
          if [ -z "$(ls -A out/jniLibs/arm64-v8a 2>/dev/null)" ]; then
            find lo-core -type f \( -name "liblo-native-code.so" -o -name "libsofficeapp.so" \) -exec cp -v {} out/jniLibs/arm64-v8a/ \;
          fi
          ls -lh out/jniLibs/arm64-v8a
          python3 -I scripts/verify_16kb_elf.py out/jniLibs/arm64-v8a

          # Stage LibreOfficeKit runtime UNO registries, config, and RC files required by lo-bootstrap.c
          INSTDIR="lo-core/instdir"
          WORKDIR="lo-core/workdir"
          cp -f "$INSTDIR"/program/types/offapi.rdb "$INSTDIR"/program/types/oovbaapi.rdb out/assets/unpack/program/ 2>/dev/null || true
          if [ -f "$INSTDIR/program/types.rdb" ]; then
            cp -f "$INSTDIR/program/types.rdb" out/assets/unpack/program/udkapi.rdb
          elif [ -f "$INSTDIR/ure/share/misc/types.rdb" ]; then
            cp -f "$INSTDIR/ure/share/misc/types.rdb" out/assets/unpack/program/udkapi.rdb
          fi
          cp -f lo-core/android/source/fonts.conf out/assets/unpack/etc/fonts/fonts.conf 2>/dev/null || true
          find "$INSTDIR/share/fonts/truetype" -maxdepth 1 -type f \( -name "Liberation*.ttf" -o -name "Caladea-*.ttf" -o -name "Carlito-*.ttf" -o -name "Gen*.ttf" -o -name "opens___.ttf" \) -exec cp -f {} out/assets/unpack/user/fonts/ \; 2>/dev/null || true

          cp -f "$INSTDIR/program/services.rdb" out/assets/program/ 2>/dev/null || true
          cp -f "$INSTDIR/program/services/services.rdb" out/assets/program/services/ 2>/dev/null || true
          cp -f "$INSTDIR"/program/resource/*en-US.res out/assets/program/resource/ 2>/dev/null || true
          cp -R "$INSTDIR/share/filter" out/assets/share/ 2>/dev/null || true
          if [ -d "$INSTDIR/share/config" ]; then
            (cd "$INSTDIR/share/config" && find . -maxdepth 1 -name "images_*.zip" -exec cp -f {} "$GITHUB_WORKSPACE/out/assets/share/config/" \;) || true
            (cd "$INSTDIR/share/config" && find . -type f \( -path "*/simpress/*.xml" -o -name "annotation.ui" -o -name "hfmenubutton.ui" -o -name "inforeadonlydialog.ui" -o -name "pbmenubutton.ui" -o -name "scrollbars.ui" -o -name "tabbuttons.ui" -o -name "tabbuttonsmirrored.ui" -o -name "tabviewbar.ui" \) -exec cp --parents -f {} "$GITHUB_WORKSPACE/out/assets/share/config/" \;) || true
          fi
          cp -R "$INSTDIR/share/registry"/* out/assets/share/registry/ 2>/dev/null || true
          if [ -f "$INSTDIR/share/registry/main.xcd" ] && [ -f "lo-core/android/mobile-config.py" ]; then
            python3 lo-core/android/mobile-config.py "$INSTDIR/share/registry/main.xcd" out/assets/share/registry/main.xcd
          fi
          if [ -f "$INSTDIR/share/registry/res/registry_en-US.xcd" ] && [ -f "lo-core/android/mobile-config.py" ]; then
            python3 lo-core/android/mobile-config.py "$INSTDIR/share/registry/res/registry_en-US.xcd" out/assets/share/registry/res/registry_en-US.xcd
          fi
          find "$WORKDIR/CustomTarget/i18npool/breakiterator" -maxdepth 1 -name "*.data" -exec cp -f {} out/assets/share/ \; 2>/dev/null || true

          cat > out/assets/unpack/program/sofficerc << 'EOF'
          [Bootstrap]
          Logo=1
          NativeProgress=1
          URE_BOOTSTRAP=file:///assets/program/fundamentalrc
          HOME=$APP_DATA_DIR/cache
          OSL_SOCKET_PATH=$APP_DATA_DIR/cache
          EOF
          cat > out/assets/program/fundamentalrc << 'EOF'
          [Bootstrap]
          LO_LIB_DIR=file://$APP_DATA_DIR/lib/
          BRAND_BASE_DIR=file:///assets
          BRAND_SHARE_SUBDIR=share
          CONFIGURATION_LAYERS=xcsxcu:${BRAND_BASE_DIR}/share/registry res:${BRAND_BASE_DIR}/share/registry
          URE_BIN_DIR=file:///assets/ure/bin/dir/nothing-here/we-can/exec-anyway
          EOF
          cat > out/assets/program/bootstraprc << 'EOF'
          [Bootstrap]
          InstallMode=<installmode>
          ProductKey=LibreOffice 25.8
          UserInstallation=file://$APP_DATA_DIR
          EOF
          cat > out/assets/program/unorc << 'EOF'
          [Bootstrap]
          URE_INTERNAL_LIB_DIR=file://$APP_DATA_DIR/lib/
          UNO_TYPES=file://$APP_DATA_DIR/program/udkapi.rdb file://$APP_DATA_DIR/program/offapi.rdb file://$APP_DATA_DIR/program/oovbaapi.rdb
          UNO_SERVICES=file:///assets/program/services.rdb file:///assets/program/services/services.rdb
          EOF
          COMMIT_SHA="$(cat lo-core-commit.txt)"
          cat > out/assets/program/versionrc << EOF
          [Version]
          AllLanguages=en-US
          buildid=${COMMIT_SHA}
          ReferenceOOoMajorMinor=4.1
          EOF

          cp lo-core/autogen.input lo-core-commit.txt out/mplv2-disclosure/
          git -C lo-core diff > out/mplv2-disclosure/lok_patches.diff || true

      - name: Upload 16 KB ARM64 Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lok-android-arm64-16kb
          path: out/jniLibs/arm64-v8a/*.so
          retention-days: 30

      - name: Upload LibreOfficeKit Runtime Assets
        uses: actions/upload-artifact@v4
        with:
          name: lok-android-runtime-assets
          path: out/assets/
          retention-days: 30

      - name: Upload MPLv2 Source & Build Recipe Disclosure
        uses: actions/upload-artifact@v4
        with:
          name: lok-mplv2-source-manifest
          path: out/mplv2-disclosure/
          retention-days: 90

name: Android CI (Build, Unit Tests, Lint & 16 KB Check)

on:
  push:
    branches: [ main, duylt_dev ]
    paths-ignore:
      - 'docs/**'
      - 'research/**'
      - 'wireframes/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'research/**'
      - 'wireframes/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0'

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify 16 KB ELF64 alignment on bundled .so libraries
        run: python3 -I scripts/verify_16kb_elf.py app/build/outputs/apk/debug/app-debug.apk
